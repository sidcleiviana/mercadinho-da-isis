services:
  - type: web
    name: mercadinho-da-isis
    runtime: python
    rootDir: mercadinho
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn mercadinho.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: mercadinho-da-isis-db
          property: connectionString

databases:
  - name: mercadinho-da-isis-db
    databaseName: mercadinho
    user: mercadinho
